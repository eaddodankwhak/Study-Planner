<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="auth-page">
    {% include '_toast.html' %}
    <main class="auth-card">
        <header class="auth-card__banner">
            <h1>Study Planner</h1>
            <p>Sign in to your study planner</p>
        </header>

        <div class="auth-card__body">
            <form action="{{ url_for('login_post') }}" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username"
                        required>
                </div>

                <div class="form-field password-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password"
                        autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
                </div>

                <button class="button button--primary" type="submit">Sign In</button>
            </form>
        </div>

        <footer class="auth-card__footer">
            Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/hci.js') }}"></script>
    <script>
        const toggle = document.getElementById('toggle-pw');
        const pw = document.getElementById('password');
        if (toggle && pw) {
            toggle.addEventListener('click', () => {
                const show = pw.type === 'password';
                pw.type = show ? 'text' : 'password';
                toggle.textContent = show ? 'Hide' : 'Show';
            });
        }
    </script>
</body>

</html>
