<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="auth-page">
    {% include '_toast.html' %}
    <main class="auth-card">
        <header class="auth-card__banner">
            <h1>Study Planner</h1>
            <p>Create your account</p>
        </header>

        <div class="auth-card__body">
            <div class="oauth-panel">
                <a class="button button--google" href="{{ url_for('oauth_google_start') }}">
                    <svg class="oauth-panel__glyph" aria-hidden="true" width="16" height="16" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continue with Google
                </a>
                <p class="oauth-panel__hint">Sign up with Google in one click — or create an account the traditional way
                    with the form below. Both give you the same planner.</p>
            </div>

            <div class="oauth-divider" role="separator">
                <span>or</span>
            </div>

            <form action="{{ url_for('signup_post') }}" method="post">
                <div class="form-field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Ama Badu" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username"
                        required>
                </div>

                <div class="form-field password-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
                </div>

                <button class="button button--primary" type="submit">Create Account</button>
            </form>
        </div>

        <footer class="auth-card__footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/hci.js') }}"></script>
    <script>
        const toggle = document.getElementById('toggle-pw');
        const pw = document.getElementById('password');
        if (toggle && pw) {
            toggle.addEventListener('click', () => {
                const show = pw.type === 'password';
                pw.type = show ? 'text' : 'password';
                toggle.textContent = show ? 'Hide' : 'Show';
            });
        }
    </script>
</body>

</html>
