<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="auth-page">
    <main class="auth-card">
        <header class="auth-card__banner">
            <h1>Study Planner</h1>
            <p>Create your account</p>
        </header>

        <div class="auth-card__body">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <ul class="flashes" role="status" aria-live="polite">
                {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('signup_post') }}" method="post">
                <div class="form-field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Ama Badu" autocomplete="name" required>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username"
                        required>
                </div>

                <div class="form-field password-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
                </div>

                <button class="button button--primary" type="submit">Create Account</button>
            </form>
        </div>

        <footer class="auth-card__footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/hci.js') }}"></script>
    <script>
        const toggle = document.getElementById('toggle-pw');
        const pw = document.getElementById('password');
        if (toggle && pw) {
            toggle.addEventListener('click', () => {
                const show = pw.type === 'password';
                pw.type = show ? 'text' : 'password';
                toggle.textContent = show ? 'Hide' : 'Show';
            });
        }
    </script>
</body>

</html>
