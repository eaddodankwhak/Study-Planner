# Render blueprint: https://render.com/docs/blueprint-spec
#
# The Flask app lives in Backend/ and is served with gunicorn. It auto-runs
# db.init_db() at import time, so the schema is created on the first boot.

services:
  - type: web
    name: study-planner
    runtime: python
    plan: free
    buildCommand: cd Backend && pip install -r requirements.txt
    startCommand: cd Backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      # Render Python runtime version. Python 3.14 lacks psycopg2-binary
      # wheels, so pin to 3.13 (matches the local env).
      - key: PYTHON_VERSION
        value: "3.13"
      # Required
      - key: SECRET_KEY
        generateValue: true
      # Google sign-in: set both here (Render Dashboard -> Environment) so the
      # app shows "Continue with Google" for everyone with no in-app setup.
      # Create a Web application OAuth client and register
      # https://<your-app>.onrender.com/oauth/google/callback as a redirect URI.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Paste your Neon connection string here in the Render dashboard
      # (Set "Value" -> "needs manual value") and click "Save".
      - key: DATABASE_URL
        sync: false
      # Server-side provider keys, shared by the AI Hub and Stash. Stash uses
      # whichever key is set, in this order: Anthropic, OpenAI, Gemini,
      # DeepSeek, Copilot. Set one or more here, or let each user connect their
      # own key from Settings. Which one Stash prefers by default is
      # controlled with STASH_PROVIDER.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COPILOT_GITHUB_TOKEN
        sync: false
      # Stash default provider ("anthropic", "openai", "gemini", "deepseek",
      # or "copilot"). Optional; each user can still override their pick.
      - key: STASH_PROVIDER
        sync: false
      # Stash tuning (optional; see Backend/.env.example for the full list).
      - key: STASH_DAILY_TOKEN_CAP
        sync: false
      - key: STASH_MAX_PDF_PAGES
        sync: false
      - key: STASH_MAX_PPTX_SLIDES
        sync: false
      - key: STASH_KEEP_SOURCE_FILES
        sync: false
      # AI Gateway admin console: comma-separated account emails allowed to open
      # /admin/ai-gateway and the /api/ai-gateway/admin/* endpoints. Leave unset
      # to disable the console entirely (it fails closed).
      - key: AI_GATEWAY_ADMIN_EMAILS
        sync: false
      # Uploaded files (profile photos, course materials, Stash sources, AI Hub
      # material text) go into the file_blobs table so they survive a redeploy
      # and are shared across devices and gunicorn workers. The container disk is
      # ephemeral on the free plan, so the default "database" backend is what you
      # want. Only set "local" for local development.
      - key: FILE_STORAGE_BACKEND
        value: database
      # Optional AI Gateway tuning (see Backend/.env.example for the full list).
      - key: AI_GATEWAY_FREE_DAILY_REQUESTS
        sync: false
      - key: AI_GATEWAY_STANDARD_DAILY_REQUESTS
        sync: false
      - key: AI_GATEWAY_PREMIUM_DAILY_REQUESTS
        sync: false
      - key: AI_GATEWAY_CACHE_ENABLED
        sync: false
      - key: AI_GATEWAY_CIRCUIT_THRESHOLD
        sync: false
      - key: AI_GATEWAY_CIRCUIT_OPEN_SECONDS
        sync: false
      - key: AI_GATEWAY_TIMEOUT_SECONDS
        sync: false