# Render blueprint: https://render.com/docs/blueprint-spec
#
# The Flask app lives in Backend/ and is served with gunicorn. It auto-runs
# db.init_db() at import time, so the schema is created on the first boot.

services:
  - type: web
    name: study-planner
    runtime: python
    plan: free
    buildCommand: cd Backend && pip install -r requirements.txt
    startCommand: cd Backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      # Render Python runtime version. Python 3.14 lacks psycopg2-binary
      # wheels, so pin to 3.13 (matches the local env).
      - key: PYTHON_VERSION
        value: "3.13"
      # Required
      - key: SECRET_KEY
        generateValue: true
      # Paste your Neon connection string here in the Render dashboard
      # (Set "Value" -> "needs manual value") and click "Save".
      - key: DATABASE_URL
        sync: false
      # Optional: enable the AI Hub's server-side provider keys.
      # Users can still connect their own keys from Settings without these.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COPILOT_GITHUB_TOKEN
        sync: false